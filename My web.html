    from{

        opacity:0;

        transform:
            translate(-50%,20px);

    }

            translate(-50%,0);

    }

}

  .response{

    color:#00ff66;

    font-family:'Share Tech Mono',monospace;

        0 0 5px #00ff66,
        0 0 15px #00ff66,

    animation:responseGlitch .8s ease;

}


@keyframes responseGlitch{

    0%{

        opacity:0;

        transform:translateX(-10px);

        filter:blur(4px);

    }

    50%{

        opacity:.5;

    }

        opacity:1;

        0 0 8px rgba(0,255,102,.4);

}

<body>
<div class="container">  <div class="title">  
MEMORY UPLOADING<span class="cursor">_</span>  
</div>  <div class="loading-bar">  
<div class="progress"></div>  
</div>  <div class="percent">0%</div>  <div class="status">  
Initializing Memory...  
</div>  </div>
  
  <script>  
  
let progress=document.querySelector(".progress");  
let percent=document.querySelector(".percent");  
let status=document.querySelector(".status");  
  
let value=0;  
  
const messages=[  
"Initializing Memory...",  
"Decrypting Files...",  
"Scanning Identity...",  
"Recovering Lost Memories...",  
"Analyzing Consciousness...",  
"Accessing Hidden Archive...",  
"Verifying Existence...",  
"Synchronization Complete..."  
];  
  
let interval=setInterval(()=>{  
  
value++;  
  
progress.style.width=value+"%";  
percent.innerHTML=value+"%";  
  
if(value==15)  
status.innerHTML=messages[1];  
  
if(value==30)  
status.innerHTML=messages[2];  
  
if(value==45)  
status.innerHTML=messages[3];  
  
if(value==60)  
status.innerHTML=messages[4];  
  
if(value==75)  
status.innerHTML=messages[5];  
  
if(value==90)  
status.innerHTML=messages[6];  
  
if(value>=100){

status.innerHTML="Synchronization Complete...";

clearInterval(interval);

setTimeout(()=>{

glitchTransition();

},1200);

}
  
},50);  

function glitchTransition(){

let glitch=document.createElement("div");

glitch.id="glitch";

document.body.appendChild(glitch);

setTimeout(()=>{

glitch.remove();

document.querySelector(".container").style.display="none";

document.getElementById("scene2").style.display="flex";

},2000);

}

    function answerWho(){

    const questionBox =
        document.querySelector(".question-box");

    questionBox.innerHTML = `
    
        <div class="response">
            Ok, let's see if you can find me or not 😄
        </div>

        <button class="response-btn" onclick="goToMystery()">
            OKAY!
        </button>

        function leavePage(){

    document.body.innerHTML = "";

    document.body.style.background = "#000";

}

    `;

}

function answerIDC(){

    const questionBox =
        document.querySelector(".question-box");

    questionBox.innerHTML = `

        <div class="response">
            You will 😏
        </div>

        <div class="response-options">

            <button class="response-btn"
                    onclick="goToMystery()">
                1. Move forward
            </button>

            <button class="response-btn"
                    onclick="leavePage()">
                2. No need
            </button>

        </div>

    `;

}
  
</script> 
  <div id="scene2">

    <img src="eyes.png" class="eyes">

    <div class="portrait">
        <img src="shadow.png">
    </div>

    <div class="question-box">

        <div class="question">
            Do you know, who I am<span class="cursor">_</span>
        </div>

        <div class="options">

            <button onclick="answerWho()">1. Who?!</button>

            <button onclick="answerIDC()">2. IDC</button>

        </div>

    </div>

</div>
